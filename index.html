<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語彙トレーニング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F5F0; --surface: #FFFFFF;
    --ink: #1A1814; --ink2: #6B6860; --ink3: #A8A69F;
    --accent: #3B2F8F; --accent-light: #EAE8F7;
    --good: #1A7A52; --good-bg: #E3F4EC;
    --again: #B04020; --again-bg: #FAEDE8;
    --border: rgba(0,0,0,0.08); --radius: 14px;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

  .top-bar { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 1.25rem 0; }
  .logo { font-family: 'Noto Serif JP', serif; font-size: 17px; font-weight: 700; letter-spacing: .02em; color: var(--accent); }
  .stats-pill { display: flex; gap: 16px; font-size: 12px; color: var(--ink2); }
  .stats-pill span strong { color: var(--ink); font-weight: 500; }

  .progress-row { width: 100%; max-width: 560px; padding: 1.2rem 1.25rem 0; display: flex; align-items: center; gap: 10px; }
  .progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }
  .progress-txt { font-size: 12px; color: var(--ink3); min-width: 40px; text-align: right; }

  .main { width: 100%; max-width: 560px; padding: 1.5rem 1.25rem 2rem; flex: 1; display: flex; flex-direction: column; }

  .loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .spinner { width: 32px; height: 32px; border: 2.5px solid var(--accent-light); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { font-size: 14px; color: var(--ink2); }

  .card-scene { perspective: 1200px; height: 280px; margin-bottom: 1.25rem; cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(.4,0,.2,1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.75rem; gap: 10px; }
  .card-back { transform: rotateY(180deg); justify-content: flex-start; padding-top: 1.5rem; }

  .tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; letter-spacing: .04em; }
  .tag-kango    { background: #EAE8F7; color: #3B2F8F; }
  .tag-wago     { background: #E3F4EC; color: #1A7A52; }
  .tag-yoji     { background: #FAEDE8; color: #B04020; }
  .tag-business { background: #E4EFF9; color: #1558A0; }
  .tag-phrase   { background: #FDF3E0; color: #8A5C00; }

  .word { font-family: 'Noto Serif JP', serif; font-size: 36px; font-weight: 700; color: var(--ink); letter-spacing: .04em; text-align: center; }
  .reading { font-size: 13px; color: var(--ink3); letter-spacing: .06em; }
  .tap-hint { font-size: 12px; color: var(--ink3); margin-top: .5rem; }
  .meaning { font-family: 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; color: var(--ink); text-align: center; line-height: 1.6; width: 100%; }
  .divider { width: 100%; height: 1px; background: var(--border); margin: 8px 0; flex-shrink: 0; }
  .example-box { background: var(--bg); border-radius: 8px; padding: 12px 14px; width: 100%; }
  .example-jp { font-size: 13px; color: var(--ink); line-height: 1.75; }
  .example-en { font-size: 12px; color: var(--ink3); margin-top: 5px; line-height: 1.6; font-style: italic; }

  .actions { display: flex; gap: 10px; margin-bottom: 1rem; }
  .btn-action { flex: 1; padding: 12px 0; border-radius: 10px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; border: none; font-weight: 500; transition: opacity 0.15s, transform 0.1s; }
  .btn-action:active { transform: scale(0.97); }
  .btn-again { background: var(--again-bg); color: var(--again); }
  .btn-good  { background: var(--good-bg);  color: var(--good); }

  .screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
  .screen .eyebrow { font-size: 12px; color: var(--ink3); letter-spacing: .08em; text-transform: uppercase; }
  .screen .title { font-family: 'Noto Serif JP', serif; font-size: 26px; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .screen .sub { font-size: 14px; color: var(--ink2); line-height: 1.7; }
  .btn-start { margin-top: 8px; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 13px 32px; font-size: 15px; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .btn-start:hover { opacity: .88; }
  .btn-start:disabled { opacity: .5; cursor: default; }
  .streak-badge { display: flex; align-items: center; gap: 8px; background: var(--accent-light); color: var(--accent); border-radius: 99px; padding: 8px 20px; font-size: 14px; font-weight: 500; }

  .history { width: 100%; max-width: 560px; margin-top: 4px; }
  .history-title { font-size: 12px; color: var(--ink3); letter-spacing: .06em; padding: 0 1.25rem 10px; }
  .history-item { display: flex; align-items: center; padding: 10px 1.25rem; border-top: 1px solid var(--border); font-size: 13px; }
  .history-date { flex: 1; color: var(--ink2); }
  .history-count { color: var(--ink); font-weight: 500; }
  .counter-txt { text-align: center; font-size: 13px; color: var(--ink3); }
  .err-txt { font-size: 13px; color: var(--again); margin-top: 4px; }

  @media (max-width: 400px) { .word { font-size: 28px; } .card-scene { height: 260px; } }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">語彙トレーニング</div>
  <div class="stats-pill">
    <span>連続 <strong id="streak-num">0</strong>日</span>
    <span>累計 <strong id="total-num">0</strong>語</span>
  </div>
</div>

<!-- START -->
<div class="main" id="screen-start">
  <div class="screen">
    <div class="eyebrow">毎日10語</div>
    <div class="title">今日の語彙を<br>学ぼう</div>
    <div class="sub">漢語・四字熟語・和語・フレーズを<br>ランダムにミックスして出題します。</div>
    <button class="btn-start" id="btn-generate" onclick="startSession()">新しい10語を生成 →</button>
    <div id="start-err" class="err-txt" style="display:none;"></div>
  </div>
</div>

<!-- LOADING -->
<div class="main" id="screen-loading" style="display:none;">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-msg">AIが今日の10語を選んでいます…</div>
  </div>
</div>

<!-- CARDS -->
<div id="screen-cards" style="display:none; width:100%; max-width:560px; flex-direction:column;">
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="prog" style="width:0%"></div></div>
    <div class="progress-txt" id="prog-txt">0 / 10</div>
  </div>
  <div class="main" style="padding-top:1.25rem;">
    <div class="card-scene" id="card-scene" onclick="flipCard()">
      <div class="card-inner" id="card-inner">
        <div class="card-face card-front">
          <span class="tag" id="front-tag"></span>
          <div class="word" id="front-word"></div>
          <div class="reading" id="front-reading"></div>
          <div class="tap-hint">タップして意味を見る</div>
        </div>
        <div class="card-face card-back">
          <span class="tag" id="back-tag"></span>
          <div class="meaning" id="back-meaning"></div>
          <div class="divider"></div>
          <div class="example-box">
            <div class="example-jp" id="back-example"></div>
            <div class="example-en" id="back-example-en"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="actions" id="actions" style="display:none;">
      <button class="btn-action btn-again" onclick="answer(false)">↩ もう一度</button>
      <button class="btn-action btn-good"  onclick="answer(true)">✓ 覚えた！</button>
    </div>
    <div class="counter-txt" id="counter-txt"></div>
  </div>
</div>

<!-- DONE -->
<div class="main" id="screen-done" style="display:none;">
  <div class="screen">
    <div class="eyebrow">セッション完了</div>
    <div class="title">今日も10語<br>マスターした！</div>
    <div class="streak-badge">🔥 <span id="done-streak">1</span>日連続達成</div>
    <div class="sub">累計 <strong id="done-total">0</strong> 語習得</div>
    <button class="btn-start" onclick="goToStart()">ホームに戻る</button>
  </div>
</div>

<!-- HISTORY -->
<div class="history" id="history-section" style="display:none;">
  <div class="history-title">学習記録</div>
  <div id="history-list"></div>
</div>

<script>
/* storage */
function getStorage() { try { return JSON.parse(localStorage.getItem('vocab_app') || '{}'); } catch(e) { return {}; } }
function saveStorage(d) { localStorage.setItem('vocab_app', JSON.stringify(d)); }

/* state */
let queue=[], again=[], goodCount=0, current=null, flipped=false;

function init() {
  const d = getStorage();
  document.getElementById('streak-num').textContent = d.streak || 0;
  document.getElementById('total-num').textContent  = d.total  || 0;
  renderHistory(d.history || []);
}

function renderHistory(history) {
  const list = document.getElementById('history-list');
  const sec  = document.getElementById('history-section');
  if (!history.length) { sec.style.display='none'; return; }
  sec.style.display='block';
  list.innerHTML = history.slice().reverse().slice(0,7).map(h =>
    `<div class="history-item"><span class="history-date">${h.date}</span><span class="history-count">${h.count}語習得</span></div>`
  ).join('');
}

async function startSession() {
  const btn = document.getElementById('btn-generate');
  const err = document.getElementById('start-err');
  btn.disabled=true; err.style.display='none';
  show('loading');
  try {
    const res = await fetch('/api/generate', { method:'POST' });
    if (!res.ok) throw new Error('サーバーエラー: ' + res.status);
    const data = await res.json();
    if (!data.words) throw new Error('単語データが取得できませんでした');
    queue=[...data.words]; again=[]; goodCount=0; flipped=false;
    show('cards'); nextCard();
  } catch(e) {
    show('start');
    err.textContent = '生成に失敗しました。しばらく待ってもう一度お試しください。';
    err.style.display='block';
    btn.disabled=false;
  }
}

function tagClass(tag) {
  return {'漢語':'tag-kango','四字熟語':'tag-yoji','和語':'tag-wago','ビジネス':'tag-business','表現':'tag-phrase'}[tag] || 'tag-kango';
}

function nextCard() {
  if (goodCount>=10 || (queue.length===0 && again.length===0)) { finishSession(); return; }
  if (queue.length===0) { queue=shuffle([...again]); again=[]; }
  current=queue.shift(); flipped=false;
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('actions').style.display='none';
  const tc=tagClass(current.tag);
  ['front-tag','back-tag'].forEach(id => { const el=document.getElementById(id); el.className='tag '+tc; el.textContent=current.tag; });
  document.getElementById('front-word').textContent    = current.word;
  document.getElementById('front-reading').textContent = current.reading;
  document.getElementById('back-meaning').textContent  = current.meaning;
  document.getElementById('back-example').textContent  = '例）'+current.example;
  document.getElementById('back-example-en').textContent = current.exampleEn;
  updateProgress();
}

function flipCard() {
  if (flipped) return;
  flipped=true;
  document.getElementById('card-inner').classList.add('flipped');
  document.getElementById('actions').style.display='flex';
}

function answer(good) {
  if (good) goodCount++; else again.push(current);
  updateProgress();
  setTimeout(nextCard, 180);
}

function updateProgress() {
  const pct=Math.min(goodCount,10)/10*100;
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=Math.min(goodCount,10)+' / 10';
}

function finishSession() {
  const d=getStorage();
  const today=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
  const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
  d.streak = (d.lastDate===yStr||d.lastDate===today) ? (d.streak||0)+(d.lastDate===today?0:1) : 1;
  d.lastDate=today; d.total=(d.total||0)+10;
  if (!d.history) d.history=[];
  if (!d.history.find(h=>h.date===today)) d.history.push({date:today,count:10});
  saveStorage(d);
  document.getElementById('done-streak').textContent=d.streak;
  document.getElementById('done-total').textContent=d.total;
  show('done');
}

function goToStart() {
  const d=getStorage();
  document.getElementById('streak-num').textContent=d.streak||0;
  document.getElementById('total-num').textContent=d.total||0;
  renderHistory(d.history||[]);
  show('start');
}

function show(name) {
  ['start','loading','cards','done'].forEach(n => {
    const el=document.getElementById('screen-'+n);
    if (el) el.style.display=(n===name)?(n==='cards'?'flex':'flex'):'none';
  });
  document.getElementById('history-section').style.display=(name==='start')?'block':'none';
}

function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

init();
</script>
</body>
</html>
